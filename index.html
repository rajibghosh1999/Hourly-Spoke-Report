<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spoke Performance Report</title>

    <!-- Bootstrap 5 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    
    <!-- Libraries for Export -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/FileSaver.js/2.0.5/FileSaver.min.js"></script>
    
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Loading Spinner -->
<div id="loading" class="d-none">
    <div class="spinner-border text-success" role="status">
        <span class="visually-hidden">Loading...</span>
    </div>
    <p id="loadingText" class="mt-2 fw-bold text-dark">Processing...</p>
</div>


<div class="container-fluid py-3 py-md-4 print-container">

    <!-- Main Header -->
    <div class="government-header text-center mb-4" id="governmentHeader">
        <h3 class="fw-bold text-success mt-2">
            <i class="fa-solid fa-house-medical me-2"></i> Spoke Performance Report
        </h3>
        <h5 class="fw-bold text-dark">North 24 Parganas</h5>
        <p class="text-muted mb-0">
            <i class="fa-solid fa-calendar-days me-1"></i> Report Date : <span id="reportDate" class="fw-bold text-dark"></span> 
            | <i class="fa-solid fa-clock me-1 text-primary"></i> Report Time : <span id="reportTime" class="badge bg-primary fs-6"></span>
        </p>
    </div>

    <!-- Upload & Filter Controls -->
<div class="card shadow mb-3 no-print border-dark">
    <div class="card-body py-3">
        <div class="row g-3 align-items-center">
            <!-- File Upload -->
            <div class="col-12 col-md-4">
                <label class="form-label fw-bold text-dark mb-1">
                    <i class="fa-solid fa-file-excel text-success me-1"></i> Upload File:
                </label>
                <input type="file" id="excelFile" class="form-control border-secondary" accept=".xlsx,.xls,.csv">
            </div>
            <!-- Group Select -->
            <div class="col-12 col-md-3">
                <label class="form-label fw-bold text-dark mb-1">
                    <i class="fa-solid fa-layer-group text-primary me-1"></i> Select Group:
                </label>
                <select id="groupSelect" class="form-select border-secondary fw-bold">
                    <option value="ALL">All Blocks</option>
                    <option value="BLOCK_WISE">Block Wise Summary Report</option>
                    <option value="CHO_1">CHO 1 Group</option>
                    <option value="CHO_2">CHO 2 Group</option>
                </select>
            </div>
            <!-- Time Select (নতুন যোগ করা হয়েছে) -->
            <div class="col-12 col-md-2">
                <label class="form-label fw-bold text-dark mb-1">
                    <i class="fa-solid fa-clock text-info me-1"></i> Time:
                </label>
                <select id="timeSlotSelect" class="form-select">
                    <option value="10 AM">10 AM</option>
                    <option value="12 PM">12 PM</option>
                    <option value="2 PM">2 PM</option>
                    <option value="5 PM">5 PM</option>
                </select>
            </div>
            <!-- Generate Button -->
            <div class="col-12 col-md-3 d-grid align-self-end">
                <button id="generateReport" class="btn btn-primary fw-bold">
                    <i class="fa-solid fa-chart-line me-1"></i> Generate Report
                </button>
            </div>
        </div>
    </div>
</div>

    <!-- TOP EXPORT CONTROLS PANEL -->
    <div class="card shadow mb-4 no-print border-dark bg-light">
        <div class="card-body py-2 text-center d-flex flex-wrap justify-content-center gap-2">
            <button id="btnDownloadJpg" class="btn btn-info fw-bold shadow-sm">
                <i class="fa-solid fa-image me-1"></i> Download Report as JPG
            </button>
            <button id="btnDownloadZip" class="btn btn-warning fw-bold text-dark shadow-sm">
                <i class="fa-solid fa-file-zipper me-1"></i> Download Block Wise JPGs (ZIP)
            </button>
            <button id="btnExportExcel" class="btn btn-success fw-bold shadow-sm">
                <i class="fa-solid fa-file-excel me-1"></i> Download Excel
            </button>
            <button id="btnPrint" class="btn btn-primary fw-bold shadow-sm">
                <i class="fa-solid fa-print me-1"></i> Print / PDF
            </button>
        </div>
    </div>

    <!-- Main Report Card -->
    <div class="card shadow mb-4 border-dark" id="mainReportCard">
        <div class="card-header header-spoke text-white fw-bold h5 mb-0 text-center py-2">
            <div id="reportTitleHeader">Spoke Performance Report</div>
        </div>
        
        <div class="table-responsive">
            <table class="table table-bordered border-dark align-middle mb-0 custom-black-table">
                <thead class="subhead-dark-green text-center" id="reportTableHeader">
                    <tr>
                        <th style="width: 8%;">Sl No.</th>
                        <th>AAM SKs Name</th>
                        <th>Block Name</th>
                        <th>CHO Name</th>
                        <th style="width: 20%;">Total Completed Consultation</th>
                    </tr>
                </thead>
                <tbody id="hourlyReportBody">
                    <tr>
                        <td colspan="5" class="text-center py-4 text-muted fw-bold">
                            ফাইল আপলোড করে "Generate Hourly Report" বাটনে ক্লিক করুন।
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>

</div>

<!-- Hidden Container for generating individual block JPGs -->
<div id="zipRenderContainer" style="position: absolute; left: -9999px; top: -9999px;"></div>

<!-- Scripts -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="config.js"></script>
<script src="app.js"></script>
</body>
</html>
